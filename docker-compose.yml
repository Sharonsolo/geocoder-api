version: '2.0'
services:

    api:
        container_name: geocoder_service
        build: .
        networks:
            - geocoder-network
        ports:
            - "5000:5000"
        env_file:
            - .env

    redis:
        image: redis:latest
        container_name: redis
        networks:
            - geocoder-network
        restart: on-failure
        ports:
            - "6379:6379"
networks:
    geocoder-network:
